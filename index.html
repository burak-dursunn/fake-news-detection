<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI-powered fake news detection using RoBERTa transformer model. Analyze news articles for authenticity in seconds.">
    <title>FakeNews AI - Advanced Detection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --accent: #f43f5e;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --green: #22c55e;
            --red: #f43f5e;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Outfit',sans-serif; }
        body {
            background-color: var(--bg);
            background-image:
                radial-gradient(at 0% 0%, rgba(99,102,241,0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168,85,247,0.15) 0px, transparent 50%);
            color: var(--text); min-height:100vh; display:flex; flex-direction:column;
            align-items:center; padding:2rem; overflow-x:hidden;
        }
        .container { width:100%; max-width:800px; z-index:1; }
        header { text-align:center; margin-bottom:2.5rem; animation:fadeInDown .8s ease-out; }
        h1 {
            font-size:3.2rem; font-weight:800;
            background:linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:.4rem;
        }
        .subtitle { color:var(--text-muted); font-size:1.05rem; }
        .badge { display:inline-block; background:rgba(99,102,241,.15); border:1px solid rgba(99,102,241,.3);
            border-radius:20px; padding:.25rem .75rem; font-size:.75rem; color:var(--primary);
            margin-top:.6rem; font-weight:600; }
        .main-card {
            background:var(--card-bg); backdrop-filter:blur(12px);
            border:1px solid rgba(255,255,255,.1); border-radius:24px;
            padding:2.5rem; box-shadow:0 25px 50px -12px rgba(0,0,0,.5);
            animation:fadeInUp .8s ease-out;
        }
        .input-group { margin-bottom:1.5rem; }
        label { display:block; margin-bottom:.6rem; font-weight:600; }
        .char-count { float:right; font-size:.8rem; color:var(--text-muted); font-weight:400; }
        textarea {
            width:100%; height:180px; background:rgba(15,23,42,.5);
            border:1px solid rgba(255,255,255,.1); border-radius:16px;
            padding:1.25rem; color:var(--text); font-size:1rem;
            resize:none; transition:all .3s ease; outline:none;
        }
        textarea:focus { border-color:var(--primary); box-shadow:0 0 0 4px rgba(99,102,241,.2); }
        textarea::placeholder { color:var(--text-muted); }
        .btn-row { display:flex; gap:.75rem; }
        button {
            flex:1; padding:1rem; background:linear-gradient(to right, var(--primary), var(--secondary));
            border:none; border-radius:12px; color:white; font-size:1.05rem; font-weight:600;
            cursor:pointer; transition:all .3s ease; display:flex; align-items:center;
            justify-content:center; gap:.5rem;
        }
        button:hover { transform:translateY(-2px); box-shadow:0 10px 20px -5px rgba(99,102,241,.5); filter:brightness(1.1); }
        button:active { transform:translateY(0); }
        button:disabled { opacity:.6; cursor:not-allowed; transform:none; filter:none; box-shadow:none; }
        .btn-secondary {
            background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1);
            flex:0 0 auto; padding:1rem 1.25rem;
        }
        .btn-secondary:hover { background:rgba(255,255,255,.1); box-shadow:none; filter:none; }
        .loader { width:20px; height:20px; border:3px solid rgba(255,255,255,.3);
            border-radius:50%; border-top-color:#fff; animation:spin 1s linear infinite; display:none; }
        @keyframes spin { to { transform:rotate(360deg); } }

        #result { margin-top:1.5rem; display:none; padding:1.5rem; border-radius:16px;
            text-align:center; animation:zoomIn .5s ease-out; }
        .result-fake { background:rgba(244,63,94,.08); border:1px solid rgba(244,63,94,.25); }
        .result-real { background:rgba(34,197,94,.08); border:1px solid rgba(34,197,94,.25); }
        .result-icon { font-size:2.5rem; margin-bottom:.5rem; }
        .result-title { font-size:1.4rem; font-weight:800; margin-bottom:.25rem; }
        .fake-text { color:var(--red); }
        .real-text { color:var(--green); }
        .confidence-text { color:var(--text-muted); font-size:.95rem; margin-bottom:.75rem; }
        .confidence-bar { width:100%; height:8px; background:rgba(255,255,255,.1);
            border-radius:4px; overflow:hidden; }
        .confidence-fill { height:100%; border-radius:4px; transition:width 1s cubic-bezier(.4,0,.2,1); }
        .prob-row { display:flex; justify-content:space-between; margin-top:.75rem;
            font-size:.85rem; color:var(--text-muted); }

        /* History */
        .history-section { margin-top:2rem; animation:fadeInUp 1s ease-out; }
        .history-title { font-size:1.1rem; font-weight:600; margin-bottom:1rem;
            display:flex; align-items:center; justify-content:space-between; }
        .history-title button { flex:0; padding:.4rem .8rem; font-size:.75rem; border-radius:8px; }
        .history-list { display:flex; flex-direction:column; gap:.6rem; max-height:300px; overflow-y:auto; }
        .history-item {
            background:rgba(15,23,42,.4); border:1px solid rgba(255,255,255,.06);
            border-radius:12px; padding:.85rem 1rem; cursor:pointer;
            transition:all .2s ease; display:flex; align-items:center; gap:.75rem;
        }
        .history-item:hover { background:rgba(255,255,255,.05); border-color:rgba(255,255,255,.12); }
        .history-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
        .history-dot.fake { background:var(--red); }
        .history-dot.real { background:var(--green); }
        .history-info { flex:1; min-width:0; }
        .history-text { font-size:.85rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .history-meta { font-size:.72rem; color:var(--text-muted); margin-top:.15rem; }
        .history-conf { font-size:.8rem; font-weight:600; flex-shrink:0; }
        .empty-history { text-align:center; color:var(--text-muted); padding:1.5rem; font-size:.9rem; }

        /* Error toast */
        .toast { position:fixed; bottom:2rem; left:50%; transform:translateX(-50%) translateY(100px);
            background:#1e293b; border:1px solid rgba(244,63,94,.3); color:var(--text);
            padding:.85rem 1.5rem; border-radius:12px; font-size:.9rem; z-index:100;
            transition:transform .4s ease; box-shadow:0 10px 30px rgba(0,0,0,.4); }
        .toast.show { transform:translateX(-50%) translateY(0); }

        footer { margin-top:2.5rem; color:var(--text-muted); font-size:.85rem; text-align:center; }
        footer a { color:var(--primary); text-decoration:none; }

        @keyframes fadeInDown { from{opacity:0;transform:translateY(-20px)} to{opacity:1;transform:translateY(0)} }
        @keyframes fadeInUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
        @keyframes zoomIn { from{opacity:0;transform:scale(.9)} to{opacity:1;transform:scale(1)} }

        @media (max-width:600px) {
            body { padding:1rem; }
            h1 { font-size:2.2rem; }
            .main-card { padding:1.5rem; }
            textarea { height:140px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>FakeNews AI</h1>
            <p class="subtitle">Advanced Detection powered by RoBERTa Transformer</p>
            <span class="badge">🤖 99.5% Accuracy</span>
        </header>

        <div class="main-card">
            <div class="input-group">
                <label for="newsText">
                    Paste news article content
                    <span class="char-count" id="charCount">0 / 5000</span>
                </label>
                <textarea id="newsText" placeholder="Enter the news article text you want to analyze for authenticity..." maxlength="5000"></textarea>
            </div>
            <div class="btn-row">
                <button id="analyzeBtn">
                    <span id="btnText">🔍 Analyze Authenticity</span>
                    <div id="loader" class="loader"></div>
                </button>
                <button class="btn-secondary" id="clearBtn" title="Clear text">🗑️</button>
            </div>

            <div id="result">
                <div class="result-icon" id="resultIcon"></div>
                <div class="result-title" id="resultTitle"></div>
                <div class="confidence-text" id="confidenceText"></div>
                <div class="confidence-bar">
                    <div id="confidenceFill" class="confidence-fill"></div>
                </div>
                <div class="prob-row">
                    <span id="probReal">Real: -</span>
                    <span id="probFake">Fake: -</span>
                </div>
            </div>
        </div>

        <div class="history-section" id="historySection" style="display:none;">
            <div class="history-title">
                <span>📋 Analysis History</span>
                <button class="btn-secondary" id="clearHistoryBtn">Clear</button>
            </div>
            <div class="history-list" id="historyList"></div>
        </div>

        <footer>
            Built with Python, FastAPI &amp; Transformers &middot; <a href="/health">API Status</a>
        </footer>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const $ = id => document.getElementById(id);
        const analyzeBtn = $('analyzeBtn'), newsText = $('newsText'),
              loader = $('loader'), btnText = $('btnText'),
              result = $('result'), resultTitle = $('resultTitle'),
              resultIcon = $('resultIcon'), confidenceText = $('confidenceText'),
              confidenceFill = $('confidenceFill'),
              charCount = $('charCount'), toast = $('toast'),
              probReal = $('probReal'), probFake = $('probFake'),
              historySection = $('historySection'), historyList = $('historyList');

        // Character counter
        newsText.addEventListener('input', () => {
            charCount.textContent = `${newsText.value.length} / 5000`;
        });

        // Clear button
        $('clearBtn').addEventListener('click', () => {
            newsText.value = '';
            charCount.textContent = '0 / 5000';
            result.style.display = 'none';
            newsText.focus();
        });

        // Toast notification
        function showToast(msg, duration = 3000) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), duration);
        }

        // History management
        function getHistory() {
            try { return JSON.parse(localStorage.getItem('fn_history') || '[]'); }
            catch { return []; }
        }
        function saveHistory(items) {
            localStorage.setItem('fn_history', JSON.stringify(items.slice(0, 20)));
        }
        function addToHistory(text, label, confidence) {
            const items = getHistory();
            items.unshift({
                text: text.substring(0, 120),
                label, confidence,
                time: new Date().toLocaleString('tr-TR')
            });
            saveHistory(items);
            renderHistory();
        }
        function renderHistory() {
            const items = getHistory();
            if (items.length === 0) {
                historySection.style.display = 'none';
                return;
            }
            historySection.style.display = 'block';
            historyList.innerHTML = items.map((item, i) => `
                <div class="history-item" data-index="${i}">
                    <div class="history-dot ${item.label === 'Fake' ? 'fake' : 'real'}"></div>
                    <div class="history-info">
                        <div class="history-text">${item.text}</div>
                        <div class="history-meta">${item.time} · ${item.label}</div>
                    </div>
                    <div class="history-conf" style="color:${item.label === 'Fake' ? 'var(--red)' : 'var(--green)'}">
                        ${(item.confidence * 100).toFixed(1)}%
                    </div>
                </div>
            `).join('');
        }
        $('clearHistoryBtn').addEventListener('click', () => {
            localStorage.removeItem('fn_history');
            renderHistory();
        });

        // Analyze
        analyzeBtn.addEventListener('click', async () => {
            const text = newsText.value.trim();
            if (!text) { showToast('⚠️ Please enter text to analyze.'); return; }
            if (text.length < 20) { showToast('⚠️ Please enter at least 20 characters.'); return; }

            analyzeBtn.disabled = true;
            loader.style.display = 'block';
            btnText.style.opacity = '0.5';
            result.style.display = 'none';

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });

                if (!response.ok) {
                    const err = await response.json().catch(() => ({}));
                    throw new Error(err.detail || `Server error (${response.status})`);
                }

                const data = await response.json();

                result.style.display = 'block';
                result.className = data.label === 'Fake' ? 'result-fake' : 'result-real';

                resultIcon.textContent = data.label === 'Fake' ? '🚨' : '✅';
                resultTitle.textContent = data.label === 'Fake' ? 'DETECTED AS FAKE' : 'DETECTED AS REAL';
                resultTitle.className = 'result-title ' + (data.label === 'Fake' ? 'fake-text' : 'real-text');

                const pct = (data.confidence * 100).toFixed(2);
                confidenceText.textContent = `Confidence: ${pct}%`;

                // Probability breakdown
                const probs = data.probabilities;
                if (probs) {
                    probReal.textContent = `Real: ${(probs.real * 100).toFixed(1)}%`;
                    probFake.textContent = `Fake: ${(probs.fake * 100).toFixed(1)}%`;
                }

                confidenceFill.style.width = '0%';
                confidenceFill.style.backgroundColor = data.label === 'Fake' ? 'var(--red)' : 'var(--green)';
                setTimeout(() => { confidenceFill.style.width = `${pct}%`; }, 50);

                addToHistory(text, data.label, data.confidence);

            } catch (error) {
                showToast('❌ ' + (error.message || 'An error occurred during analysis.'));
                console.error(error);
            } finally {
                analyzeBtn.disabled = false;
                loader.style.display = 'none';
                btnText.style.opacity = '1';
            }
        });

        // Keyboard shortcut: Ctrl+Enter to analyze
        newsText.addEventListener('keydown', e => {
            if (e.ctrlKey && e.key === 'Enter') analyzeBtn.click();
        });

        // Load history on page load
        renderHistory();
    </script>
</body>
</html>
